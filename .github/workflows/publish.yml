# Publishes @aberwest-group/bedrock to npmjs.com when a GitHub release is published.
#
# Uses npm "trusted publishing": npm verifies this workflow via GitHub's OIDC token, so no
# npm token is stored in the repo. One-time setup on npmjs.com: package Settings →
# Trusted Publisher → GitHub Actions → organization "AberWest-Group", repository
# "BedrockJS", workflow filename "publish.yml".
#
# To release: npm version patch|minor|major, git push --follow-tags, then create a GitHub
# release from the new tag. The tag must match package.json (v1.2.3).
name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${{ github.event.release.tag_name }}" != "$expected" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version ($expected)."
            echo "Run 'npm version <patch|minor|major>' and release the tag it creates."
            exit 1
          fi

      # prepublishOnly runs typecheck, tests (incl. licence headers) and the build first.
      - run: npm publish --access public
